name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-macos
          - os: macos-latest
            target: x86_64-macos
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: ubuntu-latest
            target: x86_64-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Build (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }}
      - name: Run tests
        run: zig build test
